# ---------------------------------------------------------------------------------------------
# removed: size() on strings
#
# `size('πέντε')` is 10 here, not 5 — the implementation counts BYTES. A length predicate that
# means something different on non-ASCII input is worse than none, so the overload goes.
# ---------------------------------------------------------------------------------------------
[[exclude]]
file = "string"
section = "size"
case = "one_unicode"
reason = "removed: size() on strings"

[[exclude]]
file = "string"
section = "size"
case = "unicode"
reason = "removed: size() on strings"

# ---------------------------------------------------------------------------------------------
# not implemented: two-variable comprehension macros
# ---------------------------------------------------------------------------------------------
[[exclude]]
file = "macros2"
reason = "not implemented: two-variable comprehension macros"

# ---------------------------------------------------------------------------------------------
# not implemented: container name resolution
#
# A `container` is a proto-package namespace that qualified identifiers resolve against. Both
# environments bind their roots by name into a flat activation, so there is no namespace to
# resolve against and nothing for the feature to do.
# ---------------------------------------------------------------------------------------------
[[exclude]]
file = "namespace"
reason = "not implemented: container name resolution"

[[exclude]]
file = "fields"
section = "qualified_identifier_resolution"
reason = "not implemented: container name resolution"

# ---------------------------------------------------------------------------------------------
# not implemented: the cel-spec checker
#
# This file asserts the type a CHECKER deduces. typed-cel has a checker, but it is a different one,
# over schema-derived types rather than proto descriptors, and it is tested directly.
# ---------------------------------------------------------------------------------------------
[[exclude]]
file = "type_deduction"
reason = "not implemented: the cel-spec checker"

# ---------------------------------------------------------------------------------------------
# removed: uint  —  moved here BY the deletion, in the deletion's own commit.
#
# Two whole SECTIONS whose subject is the construct, then the individual cases where a section
