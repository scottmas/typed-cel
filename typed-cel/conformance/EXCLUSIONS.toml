# Cases google/cel-spec ships that the typed-CEL dialect does not implement, and WHY.
#
# Every `reason` must be a dialect-row id in README.md, verbatim — `exclusions_cite_the_readme`
# checks it, so excluding a case means editing the document that defines the language. That is the
# friction that keeps EXCLUDED from becoming a place to put reds.
#
# GRANULARITY IS A JUDGEMENT, and the rule is: exclude at the level where the removed construct is
# the SUBJECT. A whole file whose topic is the construct; a whole section named for it; individual
# cases where a section mixes. Never a section chosen because that is where the failures happened
# to land.
#
# Every case is compiled through the checker a policy compiles through, then evaluated, so a rule
# here excludes a case the checker refuses as often as one the evaluator cannot answer. A refusal
# that no rule names is a red.
#
# What is deliberately NOT here: constructs the dialect removes but this crate still implements —
# `uint` arithmetic, `timestamp` comparisons, and the like. Those cases PASS today. They become
# failures when the deletion lands, and the deletion's own commit moves them here. Pre-excluding
# them would hide the deletion's blast radius, which is the one thing that makes a deletion
# auditable.
#
# `every_exclusion_rule_matches_something` rejects a rule that covers no case.

# ---------------------------------------------------------------------------------------------
# removed: protobuf
#
# Neither environment produces a protobuf message. Six whole files are about nothing else, and the
# scattered cases are message literals reached by a construct that is otherwise supported.
# ---------------------------------------------------------------------------------------------
[[exclude]]
file = "proto2"
reason = "removed: protobuf"

[[exclude]]
file = "proto3"
reason = "removed: protobuf"

[[exclude]]
file = "proto2_ext"
reason = "removed: protobuf"

[[exclude]]
file = "enums"
reason = "removed: protobuf"

[[exclude]]
file = "wrappers"
reason = "removed: protobuf"

# `dynamic` is `google.protobuf.Value`/`Any` and the JSON<->proto conversions built on them.
[[exclude]]
file = "dynamic"
reason = "removed: protobuf"

[[exclude]]
file = "comparisons"
section = "eq_wrapper"
reason = "removed: protobuf"

# These sections test PARSING, but every expression in them is a proto message literal, so there
# is nothing left to parse once messages are gone.
[[exclude]]
file = "parse"
section = "struct_field_names"
reason = "removed: protobuf"

[[exclude]]
file = "parse"
section = "whitespace"
reason = "removed: protobuf"

[[exclude]]
file = "parse"
section = "comments"
reason = "removed: protobuf"

[[exclude]]
