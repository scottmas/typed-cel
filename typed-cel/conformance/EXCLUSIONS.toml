# ---------------------------------------------------------------------------------------------
# diverges: exact integers span int64 and uint64
#
# An integer is exact across `[i64::MIN, u64::MAX]`: past `i64::MAX` it is a `u64`, not an int64
# overflow. `9223372036854775807 + 1` is `9223372036854775808` here; spec CEL errors. Past `u64::MAX`
