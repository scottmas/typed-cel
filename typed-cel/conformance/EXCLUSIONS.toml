case = "zero_based_double"
reason = "removed: dyn()"

# `dyn(timestamp(0)) == null` — removed twice over; `dyn()` is the outer construct.
[[exclude]]
file = "comparisons"
section = "eq_literal"
case = "not_eq_dyn_timestamp_null"
reason = "removed: dyn()"

