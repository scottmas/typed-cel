# typed-cel — a small, fully statically typed CEL dialect.
#
# This is a FORK of cel-rust 0.14.2, absorbed. There is no `cel` dependency, no upstream to
# track and no patch set to rebase — see ATTRIBUTION.md for the fork point and the change list.
# The dialect's changes are mostly SUBTRACTIONS (no protobuf, no optionals, no timestamps, no
# uint, one numeric type), which is precisely what a dependency cannot give you.
#
# `src/` is the absorbed source, module layout unchanged so a reader can diff against the fork
# point. Files authored for the dialect (ty.rs, check.rs, specialize.rs, fast/, …) land alongside it.
#
#   cargo test -p typed-cel        # everything, including the absorbed unit tests
[package]
name = "typed-cel"
version = "0.1.0"
edition = "2021"
# Upstream's floor. Kept rather than lowered: antlr4rust and the generated parser want it.
rust-version = "1.86.0"
publish = false
# MIT for the code (cel-rust's license, and this fork's). The ANTLR grammar under
# `src/parser/gen/` and the vendored cel-spec corpus under `conformance/corpus/` are Google's,
# under Apache-2.0. See ATTRIBUTION.md.
license = "MIT AND Apache-2.0"
description = "A fully statically typed CEL dialect — a fork of cel-rust 0.14.2, reduced and typed"

[lib]
name = "typed_cel"
path = "src/lib.rs"

[features]
# Upstream's default is ["regex", "chrono"], with `json` and `bytes` opt-in. We turn those on by
# default instead, because both are load-bearing here and because a plain `cargo test -p
# typed-cel` must run EVERY absorbed unit test — a feature-gated test that never runs is the
# same silent green this crate exists to avoid.
#   regex  — `matches()`.
#   chrono — `duration()`. Timestamps ride the same feature and are deleted separately.
#   json   — the activation is JSON-shaped: values are bound from serde_json::Value.
#   bytes  — a schema can declare a bytes field, so a value can be one.
default = ["regex", "chrono", "json", "bytes"]
bytes = ["dep:bytes"]
chrono = ["dep:chrono"]
json = ["dep:serde_json"]
regex = ["dep:regex"]
# The cel-spec conformance harness — the corpus reader, EXCLUSIONS.toml and the report bin.
# Feature-gated so `toml` and serde's derive machinery stay OUT of what a consumer of the dialect
# links. The dev-dependency on ourselves below turns it on for the whole test build.
conformance = ["dep:toml", "serde/derive"]

[dependencies]
# The ANTLR runtime the generated parser runs on. This is the part of the fork you would least
# want to hand-write: `src/parser/gen/` is generated from Google's official CEL.g4.
antlr4rust = "0.5.2"
lazy_static = "1.5.0"
nom = "7.1.3"
pastey = "0.2.1"
serde = "1.0"
thiserror = "2"
bytes = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "alloc",
    "serde",
    "clock",
], optional = true }
regex = { version = "1.10.5", optional = true }
serde_json = { version = "1.0", optional = true }
# EXCLUSIONS.toml / baseline.toml, behind `conformance`.
toml = { version = "0.8", optional = true }

# The report bin reads EXCLUSIONS.toml, so it needs the feature that supplies the TOML reader. A
# bin cannot see dev-dependencies, which is why `toml` is an optional NORMAL dependency rather
# than a dev one.
#   cargo run -p typed-cel --features conformance --bin conformance-report
[[bin]]
name = "conformance-report"
path = "src/bin/conformance-report.rs"
required-features = ["conformance"]

[dev-dependencies]
# typed-cel dev-depends on ITSELF to switch `conformance` on for the test targets. Cargo unifies
# features across the graph, so `cargo test -p typed-cel` builds with the corpus reader available
# and `tests/conformance.rs` runs — without `conformance` leaking into what a consumer links.
typed-cel = { path = ".", features = ["conformance"] }
